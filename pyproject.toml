[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doomscroll"
version = "0.1.0"
description = "Turn saved Instagram reels into a deduplicated, Claude-readable knowledge vault."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "scipy>=1.11",
    "yt-dlp",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
